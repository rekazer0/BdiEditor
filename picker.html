<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="/src/picker.css" />
    <title>图片选择</title>
  </head>
  <body>
    <header class="picker-toolbar">
      <button id="picker-back" class="picker-back" type="button" aria-label="切换至全部样式" hidden>
        <svg class="picker-back-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 1.5 3 6l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <span id="picker-back-label">全部样式</span>
      </button>
      <div class="picker-heading">
        <span id="picker-style" hidden></span>
        <strong id="picker-title">图片选择</strong>
        <span id="picker-subtitle"></span>
      </div>
      <input id="resource-search" type="search" results="0" placeholder="搜索图片资源" aria-label="搜索图片资源" hidden />
    </header>
    <main>
      <section id="image-picker-view" class="image-picker-view">
        <div class="picker-canvas-stage"><canvas id="picker-canvas" width="720" height="420" aria-label="原始图片切片选择器"></canvas></div>
        <p id="picker-meta">点击图片中的切片以修改引用</p>
      </section>
      <section id="resource-picker-view" class="resource-picker-view" hidden>
        <div id="resource-picker-grid" class="resource-picker-grid"></div>
        <p id="resource-empty" hidden>没有匹配的图片资源</p>
      </section>
    </main>
    <script type="module" src="/src/picker-window.ts"></script>
  </body>
</html>
