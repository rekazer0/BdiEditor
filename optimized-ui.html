<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优化后的UI设计</title>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            gap: 30px;
        }

        .panel {
            background: white;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-title {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        /* 原始设计 */
        .original .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 24px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            position: relative;
        }

        .original .menu-item:first-child {
            background: #f0f8ff;
        }

        .original .menu-item:first-child::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            background: #0099ff;
            border-radius: 0 2px 2px 0;
        }

        .original .menu-item:hover {
            background: #f5f7fa;
        }

        .original .icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .original .icon svg {
            width: 24px;
            height: 24px;
            stroke: #666;
            fill: none;
            stroke-width: 2;
        }

        .original .menu-item:first-child .icon svg {
            fill: #0099ff;
            stroke: none;
        }

        .original .label {
            font-size: 14px;
            color: #333;
        }

        /* 优化版本A - 现代扁平风格 */
        .optimized-a .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 18px 28px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background: white;
        }

        .optimized-a .menu-item:hover {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            transform: translateY(-2px);
        }

        .optimized-a .menu-item.active {
            background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
        }

        .optimized-a .menu-item.active .label {
            color: white;
            font-weight: 600;
        }

        .optimized-a .icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f4ff;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .optimized-a .menu-item.active .icon {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .optimized-a .menu-item:hover .icon {
            background: #e3eaff;
        }

        .optimized-a .icon svg {
            width: 24px;
            height: 24px;
            stroke: #0066ff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s;
        }

        .optimized-a .menu-item.active .icon svg {
            stroke: white;
        }

        .optimized-a .label {
            font-size: 13px;
            color: #333;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* 优化版本B - 卡片风格 */
        .optimized-b .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 20px 26px;
            cursor: pointer;
            border-radius: 14px;
            transition: all 0.3s ease;
            background: #fafbfc;
            border: 2px solid transparent;
            position: relative;
        }

        .optimized-b .menu-item:hover {
            background: white;
            border-color: #e0e6ed;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .optimized-b .menu-item.active {
            background: white;
            border-color: #0066ff;
            box-shadow: 0 4px 16px rgba(0, 102, 255, 0.12);
        }

        .optimized-b .menu-item.active::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            height: 3px;
            background: linear-gradient(90deg, #0066ff 0%, #00ccff 100%);
            border-radius: 14px 14px 0 0;
        }

        .optimized-b .icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0f4ff 0%, #e3eaff 100%);
            border-radius: 14px;
            transition: all 0.3s;
            position: relative;
        }

        .optimized-b .menu-item.active .icon {
            background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.25);
        }

        .optimized-b .menu-item:hover .icon {
            transform: scale(1.08);
        }

        .optimized-b .icon svg {
            width: 26px;
            height: 26px;
            stroke: #0066ff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .optimized-b .menu-item.active .icon svg {
            stroke: white;
        }

        .optimized-b .label {
            font-size: 13px;
            color: #4a5568;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .optimized-b .menu-item.active .label {
            color: #0066ff;
            font-weight: 600;
        }

        /* 优化版本C - 极简风格 */
        .optimized-c .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 16px 30px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s ease;
            position: relative;
            background: transparent;
        }

        .optimized-c .menu-item::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: #0066ff;
            border-radius: 2px;
            transition: height 0.25s ease;
        }

        .optimized-c .menu-item.active::before {
            height: 60%;
        }

        .optimized-c .menu-item:hover {
            background: rgba(0, 102, 255, 0.04);
        }

        .optimized-c .menu-item.active {
            background: rgba(0, 102, 255, 0.06);
        }

        .optimized-c .icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
        }

        .optimized-c .menu-item:hover .icon {
            transform: scale(1.1);
        }

        .optimized-c .icon svg {
            width: 26px;
            height: 26px;
            stroke: #6b7280;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.25s;
        }

        .optimized-c .menu-item.active .icon svg {
            stroke: #0066ff;
            stroke-width: 2;
        }

        .optimized-c .label {
            font-size: 13px;
            color: #6b7280;
            font-weight: 500;
            letter-spacing: 0.2px;
            transition: all 0.25s;
        }

        .optimized-c .menu-item.active .label {
            color: #0066ff;
            font-weight: 600;
        }
    </style>
</head>
<body>

            <div class="menu-item">

                        <path d="M18 2l3.5 3.5L11 16l-4 1 1-4L18 2z"/>
                    </svg>
                </div>
                <div class="label">样式</div>
            </div>
            <div class="menu-item">
                <div class="icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                </div>

            </div>

                <div class="icon">
                    <svg viewBox="0 0 24 24">

                    </svg>
                </div>
                <div class="label">动作</div>
            </div>
        </div>

        <!-- 优化版本B - 卡片 -->
        <div class="panel optimized-b">
            <div class="panel-title">优化版B - 卡片风格</div>
            <div class="menu-item active">
                <div class="icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="3"/>
                        <path d="M3 9h18M9 9v12"/>
                    </svg>
                </div>
                <div class="label">布局</div>
            </div>
            <div class="menu-item">
                <div class="icon">

                        <circle cx="12" cy="12" r="3"/>

        <div class="panel optimized-c">

            <div class="menu-item active">

            </div>
        </div>
    </div>

    <script>
        // 为每个面板添加交互
        document.querySelectorAll('.panel').forEach(panel => {
            panel.querySelectorAll('.menu-item').forEach(item => {
                item.addEventListener('click', function() {
                    // 移除同一面板内其他项的active类
                    panel.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                    // 添加active类到当前项
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
