<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="/src/new-project.css" />
    <title>新建皮肤</title>
  </head>
  <body>
    <form id="new-project-window-form">
      <header>
        <h1>新建皮肤</h1>
        <p>选择一个内置模板作为皮肤起点。</p>
        <p class="usage-note">内置皮肤来自互联网整理，仅供技术交流，请勿商用。<br />如有侵权，请联系作者下架。</p>
      </header>
      <section class="templates" aria-labelledby="template-heading">
        <div id="template-heading" class="template-heading">内置模板 <span>7 款可选</span></div>
        <div class="template-list" role="radiogroup" aria-labelledby="template-heading">
        <label class="template-option">
          <input type="radio" name="project-template" value="default-android" checked />
          <span><strong>百度官方 Android BDA 默认皮肤</strong><small>官方 1080p 横竖屏样式与资源</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="official-android-bds" />
          <span><strong>百度官方 Android BDS 默认皮肤</strong><small>官方旧格式 480px 横竖屏布局</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="oppo-swipe-down" />
          <span><strong>OPPO皮肤加下滑功能</strong><small>互联网整理 BDS 皮肤</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="oppo-dual-color" />
          <span><strong>OPPO默认双色皮肤</strong><small>互联网整理 BDS 皮肤</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="iqoo-rounded-black" />
          <span><strong>IQOO提取圆角黑色</strong><small>互联网整理 BDS 皮肤</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="xiaomi-unified-rounded-blur" />
          <span><strong>小米默认皮肤(统一颜色键盘版3)_适配圆角模糊</strong><small>互联网整理 BDS 皮肤</small></span>
        </label>
        <label class="template-option">
          <input type="radio" name="project-template" value="huawei-swipe-symbols-1080" />
          <span><strong>华为提取上滑符号1080</strong><small>互联网整理 BDS 皮肤</small></span>
        </label>
        </div>
      </section>
      <footer>
        <p id="project-error" role="alert" hidden></p>
        <button id="cancel" type="button">取消</button>
        <button class="primary" type="submit">创建皮肤</button>
      </footer>
    </form>
    <script type="module" src="/src/new-project-window.ts"></script>
  </body>
</html>
