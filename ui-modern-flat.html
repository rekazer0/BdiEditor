<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现代扁平风格UI</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel {
            background: white;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08),
                        0 0 0 1px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 120px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 18px 20px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background: white;
            user-select: none;
        }

        .menu-item:hover {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            transform: translateY(-2px);
        }

        .menu-item.active {
            background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);
            box-shadow: 0 4px 16px rgba(0, 102, 255, 0.35),
                        0 2px 8px rgba(0, 102, 255, 0.2);
            transform: translateY(-1px);
        }

        .menu-item.active .label {
            color: white;
            font-weight: 600;
        }

        .icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f4ff;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-item.active .icon {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .menu-item:hover:not(.active) .icon {
            background: #e3eaff;
            transform: scale(1.03);
        }

        .icon svg {
            width: 24px;
            height: 24px;
            stroke: #0066ff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-item.active .icon svg {
            stroke: white;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.1));
        }

        .label {
            font-size: 13px;
            color: #333;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-item:hover:not(.active) .label {
            color: #0066ff;
        }

        /* 添加激活指示器动画 */
        .menu-item::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%) scaleY(0);
            width: 4px;
            height: 40%;
            background: linear-gradient(180deg, #0066ff 0%, #0052cc 100%);
            border-radius: 0 2px 2px 0;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-item.active::before {
            transform: translateY(-50%) scaleY(1);
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            .panel {
                width: 100px;
            }

            .menu-item {
                padding: 14px 16px;
                gap: 8px;
            }

            .icon {
                width: 40px;
                height: 40px;
            }

            .icon svg {
                width: 22px;
                height: 22px;
            }

            .label {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="menu-item active">
            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M3 9h18M9 9v12"/>
                </svg>
            </div>
            <div class="label">布局</div>
        </div>

        <div class="menu-item">
            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M20 14.66V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5.34"/>
                    <path d="M18 2l3.5 3.5L11 16l-4 1 1-4L18 2z"/>
                </svg>
            </div>
            <div class="label">样式</div>
        </div>

        <div class="menu-item">
            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
            </div>
            <div class="label">文字</div>
        </div>

        <div class="menu-item">
            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
            </div>
            <div class="label">动作</div>
        </div>
    </div>

    <script>
        // 菜单项交互
        const menuItems = document.querySelectorAll('.menu-item');

        menuItems.forEach(item => {
            item.addEventListener('click', function(e) {
                // 移除所有active状态
                menuItems.forEach(i => i.classList.remove('active'));

                // 添加active到当前项
                this.classList.add('active');

                // 添加点击动画效果
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 100);
            });

            // 触摸设备支持
            item.addEventListener('touchstart', function(e) {
                e.preventDefault();
                this.click();
            }, { passive: false });
        });

        // 键盘导航支持
        document.addEventListener('keydown', (e) => {
            const currentActive = document.querySelector('.menu-item.active');
            const currentIndex = Array.from(menuItems).indexOf(currentActive);
            let nextIndex;

            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                nextIndex = (currentIndex + 1) % menuItems.length;
                menuItems[nextIndex].click();
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                nextIndex = (currentIndex - 1 + menuItems.length) % menuItems.length;
                menuItems[nextIndex].click();
            } else if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                currentActive.click();
            }
        });
    </script>
</body>
</html>
