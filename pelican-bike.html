<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            font-family: sans-serif;
        }

        .container {
            position: relative;
            width: 800px;
            height: 600px;
            overflow: hidden;
        }

        .scene {
            animation: moveScene 8s linear infinite;
        }

        @keyframes moveScene {
            from { transform: translateX(0); }
            to { transform: translateX(-400px); }
        }

        .wheel {
            animation: rotate 1s linear infinite;
            transform-origin: center;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pelican-body {
            animation: bounce 0.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .wing {
            animation: flap 0.8s ease-in-out infinite;
            transform-origin: 20% 50%;
        }

        @keyframes flap {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-15deg); }
        }

        .cloud {
            animation: floatCloud 20s linear infinite;
        }

        @keyframes floatCloud {
            from { transform: translateX(800px); }
            to { transform: translateX(-200px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg width="800" height="600" viewBox="0 0 800 600">
            <!-- 地面 -->
            <rect x="0" y="450" width="800" height="150" fill="#90EE90"/>

            <!-- 云朵 -->
            <g class="cloud" style="animation-delay: 0s;">
                <ellipse cx="100" cy="80" rx="40" ry="25" fill="white" opacity="0.8"/>
                <ellipse cx="130" cy="75" rx="50" ry="30" fill="white" opacity="0.8"/>
                <ellipse cx="160" cy="80" rx="40" ry="25" fill="white" opacity="0.8"/>
            </g>

            <g class="cloud" style="animation-delay: -10s;">
                <ellipse cx="500" cy="120" rx="35" ry="20" fill="white" opacity="0.7"/>
                <ellipse cx="525" cy="115" rx="45" ry="25" fill="white" opacity="0.7"/>
                <ellipse cx="550" cy="120" rx="35" ry="20" fill="white" opacity="0.7"/>
            </g>

            <!-- 鹈鹕和自行车组合 -->
            <g transform="translate(300, 300)">
                <!-- 自行车 -->
                <g>
                    <!-- 后轮 -->
                    <g class="wheel" transform="translate(-60, 100)">
                        <circle cx="0" cy="0" r="35" fill="none" stroke="#333" stroke-width="3"/>
                        <line x1="-25" y1="0" x2="25" y2="0" stroke="#333" stroke-width="2"/>
                        <line x1="0" y1="-25" x2="0" y2="25" stroke="#333" stroke-width="2"/>
                        <circle cx="0" cy="0" r="5" fill="#333"/>
                    </g>

                    <!-- 前轮 -->
                    <g class="wheel" transform="translate(60, 100)">
                        <circle cx="0" cy="0" r="35" fill="none" stroke="#333" stroke-width="3"/>
                        <line x1="-25" y1="0" x2="25" y2="0" stroke="#333" stroke-width="2"/>
                        <line x1="0" y1="-25" x2="0" y2="25" stroke="#333" stroke-width="2"/>
                        <circle cx="0" cy="0" r="5" fill="#333"/>
                    </g>

                    <!-- 车架 -->
                    <line x1="-60" y1="100" x2="-20" y2="60" stroke="#FF6B6B" stroke-width="4"/>
                    <line x1="-20" y1="60" x2="20" y2="60" stroke="#FF6B6B" stroke-width="4"/>
                    <line x1="20" y1="60" x2="60" y2="100" stroke="#FF6B6B" stroke-width="4"/>
                    <line x1="-20" y1="60" x2="-20" y2="30" stroke="#FF6B6B" stroke-width="4"/>
                    <line x1="-20" y1="30" x2="5" y2="30" stroke="#FF6B6B" stroke-width="4"/>

                    <!-- 座位 -->
                    <ellipse cx="0" cy="60" rx="20" ry="8" fill="#8B4513"/>

                    <!-- 把手 -->
                    <line x1="5" y1="30" x2="15" y2="20" stroke="#FF6B6B" stroke-width="3"/>
                    <line x1="15" y1="20" x2="5" y2="20" stroke="#333" stroke-width="3"/>
                    <line x1="15" y1="20" x2="25" y2="20" stroke="#333" stroke-width="3"/>
                </g>

                <!-- 鹈鹕 -->
                <g class="pelican-body">
                    <!-- 身体 -->
                    <ellipse cx="0" cy="35" rx="45" ry="55" fill="#FFE4B5" stroke="#DEB887" stroke-width="2"/>

                    <!-- 头部 -->
                    <circle cx="15" cy="-20" r="28" fill="#FFE4B5" stroke="#DEB887" stroke-width="2"/>

                    <!-- 眼睛 -->
                    <circle cx="20" cy="-25" r="5" fill="black"/>
                    <circle cx="22" cy="-27" r="2" fill="white"/>

                    <!-- 长喙上部 -->
                    <path d="M 30 -15 Q 80 -20, 95 -15" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>

                    <!-- 长喙下部和喉囊 -->
                    <path d="M 30 -10 Q 50 10, 80 5 Q 90 0, 95 -15" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
                    <path d="M 30 -10 Q 40 15, 55 12 Q 65 10, 80 5" fill="#FFE4B5" opacity="0.6"/>

                    <!-- 翅膀 -->
                    <g class="wing">
                        <ellipse cx="-25" cy="20" rx="35" ry="50" fill="#F5DEB3" stroke="#DEB887" stroke-width="2"/>
                        <path d="M -20 10 Q -45 20, -50 40 Q -45 60, -30 65" fill="#DEB887" opacity="0.3"/>
                    </g>

                    <!-- 尾巴 -->
                    <path d="M -40 60 Q -60 70, -55 85 Q -50 80, -40 75" fill="#DEB887"/>

                    <!-- 腿（骑在自行车上） -->
                    <line x1="5" y1="70" x2="-15" y2="95" stroke="#FFA500" stroke-width="4"/>
                    <line x1="-5" y1="70" x2="15" y2="95" stroke="#FFA500" stroke-width="4"/>

                    <!-- 脚 -->
                    <ellipse cx="-15" cy="98" rx="8" ry="4" fill="#FF8C00"/>
                    <ellipse cx="15" cy="98" rx="8" ry="4" fill="#FF8C00"/>
                </g>
            </g>

            <!-- 太阳 -->
            <circle cx="700" cy="80" r="40" fill="#FFD700" opacity="0.8"/>

            <!-- 装饰性文字 -->
            <text x="400" y="550" text-anchor="middle" font-size="24" fill="#228B22" font-weight="bold">
                🚴 鹈鹕骑行日 🚴
            </text>
        </svg>
    </div>
</body>
</html>
