name: cloudbase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudbase
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy CloudBase Web App
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          npx tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          npx tcb app deploy bdieditor -e "$TCB_ENV_ID" --framework vite --install-command "npm ci" --build-command "npm run build" --output-dir dist --deploy-path / --force
      - name: Verify CloudBase Web App
        env:
          APP_URL: https://bdieditor-bdieditor-d4gdhm3ir22dcc04c.webapps.tcloudbase.com/
        run: |
          expected_asset="$(grep -oE 'assets/index-[^\"]+\.js' dist/index.html | head -1)"
          test -n "$expected_asset"
          for attempt in $(seq 1 24); do
            deployed_html="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${APP_URL}?deploy=${GITHUB_SHA}&attempt=${attempt}")"
            if grep -Fq "$expected_asset" <<< "$deployed_html"; then
              echo "Verified ${expected_asset} at ${APP_URL}"
              exit 0
            fi
            echo "Waiting for Web App rollout (${attempt}/24)..."
            sleep 10
          done
          echo "Expected ${expected_asset}, but Web App still serves:"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${APP_URL}?deploy=${GITHUB_SHA}&final=1" | grep -oE 'assets/index-[^\"]+' || true
          exit 1
