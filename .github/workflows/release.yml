name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "BDI 皮肤编辑器 ${{ github.ref_name }}" \
            --notes "百度 iOS 输入法皮肤可视化编辑器。
          支持 iPhone 17 Pro / Pro Max、Xiaomi 17、Pixel 10 Pro、Galaxy S25 Ultra 预览
          横竖屏与深浅色主题实时预览
          新建 / 打开 / 编辑 / 导出 .bdi / .bds 皮肤"

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --bundles app
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build bundles
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Package macOS .app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent "BDI 皮肤编辑器.app" "BDI 皮肤编辑器-0.1.0-macos.app.zip"
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "macOS" ]; then
            gh release upload "${{ github.ref_name }}" \
              "macos/BDI 皮肤编辑器-0.1.0-macos.app.zip" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release upload "${{ github.ref_name }}" \
              nsis/*.exe msi/*.msi \
              --repo "${{ github.repository }}" --clobber
          fi
