name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { printing = 1 }
            printing && $0 ~ "^## " && $0 !~ "^## " version "([[:space:]]|$)" { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "BdiEditor ${{ github.ref_name }}" \
            --notes-file release-notes.md

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Build bundles
        shell: bash
        run: |
          ARGS="--bundles ${{ matrix.bundles }}"
          if [ -n "${{ matrix.target }}" ]; then ARGS="$ARGS --target ${{ matrix.target }}"; fi
          npm run tauri build -- $ARGS
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ -n "$TARGET" ]; then
            cd "src-tauri/target/$TARGET/release/bundle"
          else
            cd src-tauri/target/release/bundle
          fi
          shopt -s nullglob
          if [ "$RUNNER_OS" = "macOS" ]; then
            gh release upload "${{ github.ref_name }}" \
              dmg/*.dmg \
              --repo "${{ github.repository }}" --clobber
          else
            gh release upload "${{ github.ref_name }}" \
              nsis/*.exe \
              --repo "${{ github.repository }}" --clobber
          fi
